services:
  family-ip:
    image: ghcr.io/horse-gemini/family-ip:2.1
    build:
      context: .
      args:
        BUILD_VERSION: local
    container_name: family-ip
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DEPLOYMENT_MODE: docker
      VPNGATE_DATA_DIR: /data
      # Web 管理后台默认仅监听回环地址，避免暴露在公网（配合 network_mode: host）。
      # 如需对外访问，请使用 SSH 隧道，或改为 "0.0.0.0" 并自行做好防火墙/鉴权（注意风险）。
      UI_HOST: "127.0.0.1"
      UI_PORT: "8787"
      LOCAL_PROXY_HOST: "127.0.0.1"
      LOCAL_PROXY_PORT: "7928"
    volumes:
      - family-ip-data:/data
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  family-ip-data:
